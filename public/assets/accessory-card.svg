<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#F8F9FA" rx="4"/>
  <rect x="16" y="16" width="368" height="368" fill="none" stroke="#E2E4E8" stroke-width="1" rx="4"/>
  
  <!-- MicroSD card shape -->
  <g transform="translate(110, 80)">
    <path d="M 10 30 L 30 10 L 170 10 L 170 230 L 10 230 Z" fill="#1A1C20" stroke="#121316" stroke-width="2"/>
    <rect x="30" y="30" width="120" height="110" fill="#24272E" rx="2"/>
    <text x="90" y="65" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">ALUVION</text>
    <text x="90" y="95" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="22" font-weight="700" fill="#E8B4B8">128 GB</text>
    <text x="90" y="125" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#C0C4CC">U3 V30 A1 4K</text>
    <!-- Contact pins on back hint -->
    <rect x="30" y="170" width="12" height="40" fill="#D8D4CE"/>
    <rect x="50" y="170" width="12" height="40" fill="#D8D4CE"/>
    <rect x="70" y="170" width="12" height="40" fill="#D8D4CE"/>
    <rect x="90" y="170" width="12" height="40" fill="#D8D4CE"/>
    <rect x="110" y="170" width="12" height="40" fill="#D8D4CE"/>
    <rect x="130" y="170" width="12" height="40" fill="#D8D4CE"/>
  </g>
  <text x="200" y="350" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#121316">128GB MicroSD Card</text>
</svg>
