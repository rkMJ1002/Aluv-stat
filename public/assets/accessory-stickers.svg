<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#F8F9FA" rx="4"/>
  <rect x="16" y="16" width="368" height="368" fill="none" stroke="#E2E4E8" stroke-width="1" rx="4"/>

  <!-- Sticker sheet 1 (Offset) -->
  <g transform="translate(90, 70) rotate(-6)">
    <rect x="0" y="0" width="140" height="200" rx="4" fill="#FFFFFF" stroke="#D8D4CE" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="22" fill="#E8B4B8"/>
    <rect x="80" y="25" width="45" height="40" rx="2" fill="#24272E"/>
    <polygon points="45,100 25,140 65,140" fill="#E2E4E8"/>
    <circle cx="100" cy="120" r="18" fill="#121316"/>
    <rect x="25" y="160" width="90" height="20" rx="2" fill="#F0F2F5" stroke="#C0C4CC" stroke-width="1"/>
  </g>

  <!-- Sticker sheet 2 (Foreground) -->
  <g transform="translate(160, 90) rotate(4)">
    <rect x="0" y="0" width="140" height="200" rx="4" fill="#FFFFFF" stroke="#121316" stroke-width="2"/>
    <rect x="20" y="20" width="100" height="30" rx="2" fill="#121316"/>
    <text x="70" y="38" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">ALUVION</text>
    <circle cx="45" cy="85" r="20" fill="#E8B4B8"/>
    <circle cx="95" cy="85" r="20" fill="#E2E4E8"/>
    <rect x="20" y="125" width="100" height="24" rx="2" fill="#24272E"/>
    <text x="70" y="141" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#FFFFFF">4K POCKET</text>
    <circle cx="50" cy="175" r="14" fill="#121316"/>
    <circle cx="90" cy="175" r="14" fill="#D8D4CE"/>
  </g>

  <text x="200" y="350" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#121316">Camera Sticker Sets (2 Sheets)</text>
</svg>
