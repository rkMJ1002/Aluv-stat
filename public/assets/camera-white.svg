<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Clean studio background -->
  <rect width="800" height="500" fill="#F8F9FA" rx="4"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#E2E4E8" stroke-width="1" rx="4"/>

  <!-- Subtle shadow under camera -->
  <ellipse cx="400" cy="420" rx="260" ry="18" fill="#24272E" opacity="0.12"/>

  <!-- Camera Body (Pearl White) -->
  <rect x="180" y="130" width="440" height="260" rx="14" fill="#FFFFFF" stroke="#D8D4CE" stroke-width="2"/>
  
  <!-- Top Deck Bezel & Texture -->
  <path d="M 180 160 L 620 160 L 620 144 C 620 136 614 130 606 130 L 194 130 C 186 130 180 136 180 144 Z" fill="#E2E4E8"/>
  <line x1="180" y1="160" x2="620" y2="160" stroke="#C0C4CC" stroke-width="1.5"/>

  <!-- Shutter Button and Dial on Top -->
  <rect x="220" y="118" width="54" height="12" rx="3" fill="#D8D4CE" stroke="#A8ACB4" stroke-width="1.5"/>
  <rect x="540" y="118" width="48" height="12" rx="2" fill="#E2E4E8" stroke="#A8ACB4" stroke-width="1.5"/>
  <!-- Power Switch -->
  <rect x="300" y="123" width="28" height="7" rx="2" fill="#24272E"/>

  <!-- Front Grip Inset -->
  <rect x="560" y="180" width="36" height="180" rx="6" fill="#F0F2F5" stroke="#E2E4E8" stroke-width="1.5"/>
  <line x1="578" y1="195" x2="578" y2="345" stroke="#D8D4CE" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Integrated LED Fill Light -->
  <rect x="230" y="180" width="28" height="16" rx="3" fill="#FFFFFF" stroke="#A8ACB4" stroke-width="1.5"/>
  <circle cx="244" cy="188" r="4" fill="#E2E4E8"/>

  <!-- Sensor / Autofocus window -->
  <circle cx="280" cy="188" r="3.5" fill="#121316"/>

  <!-- Brushed Aluminum Lens Outer Bezel -->
  <circle cx="390" cy="270" r="105" fill="#E2E4E8" stroke="#A8ACB4" stroke-width="2.5"/>
  <!-- Concentric milled ridges -->
  <circle cx="390" cy="270" r="95" fill="#D8D4CE" stroke="#C0C4CC" stroke-width="1.5"/>
  <circle cx="390" cy="270" r="82" fill="#24272E" stroke="#121316" stroke-width="2"/>
  
  <!-- Optical Glass Element with multi-coating reflection -->
  <circle cx="390" cy="270" r="66" fill="#121316"/>
  <circle cx="390" cy="270" r="50" fill="#1A1C20" stroke="#24272E" stroke-width="1.5"/>
  <circle cx="390" cy="270" r="32" fill="#121316"/>
  <!-- Aperture ring blades reflection -->
  <circle cx="380" cy="260" r="16" fill="#24272E" opacity="0.6"/>
  <circle cx="376" cy="254" r="5" fill="#FFFFFF" opacity="0.5"/>

  <!-- Lens Engravings (Monochromatic Technical Typography) -->
  <text x="390" y="198" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#E2E4E8" letter-spacing="1.5">ALUVION OPTICAL F=2.8mm</text>
  <text x="390" y="348" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#E2E4E8" letter-spacing="1.5">4K UHD / 48.0 MEGAPIXELS</text>

  <!-- Front Brand Logo Badge -->
  <text x="230" y="235" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#121316" letter-spacing="1">ALUVION</text>
  <text x="230" y="252" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#4A505C" letter-spacing="0.5">POCKET 4K</text>

  <!-- Technical Specs Badges on Right -->
  <text x="610" y="450" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#4A505C">FINISH: PEARL WHITE MATTE</text>
</svg>
