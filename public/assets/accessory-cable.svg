<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#F8F9FA" rx="4"/>
  <rect x="16" y="16" width="368" height="368" fill="none" stroke="#E2E4E8" stroke-width="1" rx="4"/>

  <!-- USB Type-C Cable Coils -->
  <path d="M 120 180 C 120 120, 280 120, 280 180 C 280 240, 140 240, 140 180 C 140 140, 260 140, 260 180" fill="none" stroke="#24272E" stroke-width="6" stroke-linecap="round"/>
  
  <!-- USB-A Connector -->
  <rect x="70" y="165" width="45" height="26" rx="3" fill="#E2E4E8" stroke="#121316" stroke-width="1.5"/>
  <rect x="50" y="170" width="20" height="16" rx="1" fill="#D8D4CE" stroke="#121316" stroke-width="1.5"/>

  <!-- USB-C Connector -->
  <rect x="270" y="168" width="42" height="20" rx="3" fill="#E2E4E8" stroke="#121316" stroke-width="1.5"/>
  <rect x="312" y="171" width="18" height="14" rx="4" fill="#D8D4CE" stroke="#121316" stroke-width="1.5"/>

  <text x="200" y="340" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#121316">USB-C Charging Cable</text>
</svg>
