<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#F8F9FA" rx="4"/>
  <rect x="16" y="16" width="368" height="368" fill="none" stroke="#E2E4E8" stroke-width="1" rx="4"/>

  <!-- Compact USB Card Reader -->
  <g transform="translate(130, 110)">
    <!-- USB Plug -->
    <rect x="50" y="0" width="40" height="35" rx="2" fill="#D8D4CE" stroke="#121316" stroke-width="1.5"/>
    <rect x="58" y="8" width="8" height="12" fill="#121316"/>
    <rect x="74" y="8" width="8" height="12" fill="#121316"/>

    <!-- Reader Body -->
    <rect x="20" y="35" width="100" height="130" rx="6" fill="#1A1C20" stroke="#121316" stroke-width="2"/>
    <rect x="35" y="55" width="70" height="85" rx="3" fill="#24272E"/>
    <text x="70" y="85" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">ALUVION</text>
    <text x="70" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#E8B4B8">USB 3.0</text>
    
    <!-- MicroSD slot cutout on side -->
    <rect x="117" y="90" width="6" height="32" rx="1" fill="#E2E4E8"/>
  </g>

  <text x="200" y="340" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#121316">USB MicroSD Card Reader</text>
</svg>
