<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#121316" rx="4"/>
  
  <!-- Technical Grid -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#24272E" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Title & Model Info -->
  <text x="40" y="50" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="1">TECHNICAL ELEVATION &amp; COMPONENT ARCHITECTURE</text>
  <text x="40" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#C0C4CC">ALUVION POCKET 4K - SCALE 1:1 CAD PROJECTION</text>

  <!-- Dimension line: Width 117mm -->
  <line x1="140" y1="110" x2="520" y2="110" stroke="#E2E4E8" stroke-width="1.5"/>
  <line x1="140" y1="102" x2="140" y2="118" stroke="#E2E4E8" stroke-width="1.5"/>
  <line x1="520" y1="102" x2="520" y2="118" stroke="#E2E4E8" stroke-width="1.5"/>
  <rect x="300" y="100" width="60" height="20" fill="#121316"/>
  <text x="330" y="114" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">117 mm</text>

  <!-- Dimension line: Height 64mm -->
  <line x1="100" y1="140" x2="100" y2="380" stroke="#E2E4E8" stroke-width="1.5"/>
  <line x1="92" y1="140" x2="108" y2="140" stroke="#E2E4E8" stroke-width="1.5"/>
  <line x1="92" y1="380" x2="108" y2="380" stroke="#E2E4E8" stroke-width="1.5"/>
  <rect x="80" y="250" width="40" height="20" fill="#121316"/>
  <text x="100" y="264" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">64 mm</text>

  <!-- Front Elevation Body Wireframe -->
  <rect x="140" y="140" width="380" height="240" rx="8" fill="#1A1C20" stroke="#E2E4E8" stroke-width="1.5"/>
  
  <!-- Optical Unit Wireframe -->
  <circle cx="310" cy="260" r="85" fill="none" stroke="#E2E4E8" stroke-width="1.5"/>
  <circle cx="310" cy="260" r="70" fill="none" stroke="#E8B4B8" stroke-width="1.5"/>
  <circle cx="310" cy="260" r="45" fill="none" stroke="#E2E4E8" stroke-width="1.5"/>
  <circle cx="310" cy="260" r="25" fill="#24272E" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="310" y1="165" x2="310" y2="355" stroke="#2E323B" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="215" y1="260" x2="405" y2="260" stroke="#2E323B" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Top Dial & Shutter -->
  <rect x="170" y="128" width="45" height="12" rx="2" fill="#24272E" stroke="#E2E4E8" stroke-width="1.5"/>
  <rect x="440" y="128" width="40" height="12" rx="2" fill="#24272E" stroke="#E2E4E8" stroke-width="1.5"/>

  <!-- Front Fill Light -->
  <rect x="180" y="180" width="24" height="14" rx="2" fill="none" stroke="#E2E4E8" stroke-width="1.5"/>

  <!-- Right Profile View (Depth 29mm) -->
  <rect x="580" y="140" width="120" height="240" rx="6" fill="#1A1C20" stroke="#E2E4E8" stroke-width="1.5"/>
  <!-- Lens Barrel Projection -->
  <rect x="555" y="200" width="25" height="120" rx="3" fill="#24272E" stroke="#E2E4E8" stroke-width="1.5"/>
  <!-- Flip Hinge Outline on Back Profile -->
  <rect x="696" y="146" width="6" height="130" rx="1" fill="#E8B4B8"/>
  <!-- USB-C Port Location -->
  <rect x="620" y="320" width="40" height="14" rx="4" fill="#121316" stroke="#E2E4E8" stroke-width="1.5"/>
  <rect x="632" y="325" width="16" height="4" rx="2" fill="#E2E4E8"/>

  <!-- Dimension line: Depth 29mm -->
  <line x1="580" y1="410" x2="700" y2="410" stroke="#E2E4E8" stroke-width="1.5"/>
  <line x1="580" y1="402" x2="580" y2="418" stroke="#E2E4E8" stroke-width="1.5"/>
  <line x1="700" y1="402" x2="700" y2="418" stroke="#E2E4E8" stroke-width="1.5"/>
  <rect x="620" y="400" width="40" height="20" fill="#121316"/>
  <text x="640" y="414" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">29 mm</text>

  <!-- Technical Callouts -->
  <!-- Callout 1: Optical Unit -->
  <polyline points="310,175 350,140 430,140" fill="none" stroke="#E2E4E8" stroke-width="1"/>
  <circle cx="310" cy="175" r="2.5" fill="#E2E4E8"/>
  <text x="435" y="143" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">OPTICAL UNIT: F=2.8mm 48MP</text>

  <!-- Callout 2: Aluminum Bezel -->
  <polyline points="380,310 440,350 490,350" fill="none" stroke="#E2E4E8" stroke-width="1"/>
  <circle cx="380" cy="310" r="2.5" fill="#E2E4E8"/>
  <text x="495" y="353" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">ALUMINUM TEXTURED BEZEL</text>

  <!-- Callout 3: Display Hinge -->
  <polyline points="700,210 740,210 740,240 760,240" fill="none" stroke="#E8B4B8" stroke-width="1"/>
  <circle cx="700" cy="210" r="2.5" fill="#E8B4B8"/>
  <text x="765" y="243" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#E8B4B8">180 DEGREE HINGE</text>

  <!-- Callout 4: USB-C Port -->
  <polyline points="640,334 640,365 570,365" fill="none" stroke="#E2E4E8" stroke-width="1"/>
  <circle cx="640" cy="334" r="2.5" fill="#E2E4E8"/>
  <text x="480" y="368" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">USB TYPE-C INTERFACE</text>

  <!-- Footnote -->
  <text x="40" y="465" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#C0C4CC">ALL MEASUREMENTS ACCORDING TO JIS-C SPECIFICATION STANDARDS. TOTAL MASS: 140 GRAMS WITH BATTERY INSERTED.</text>
</svg>
